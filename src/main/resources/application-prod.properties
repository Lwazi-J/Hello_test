spring.application.name=demo

# Security settings - use environment variables in production
spring.security.user.name=${API_USER}
spring.security.user.password=${API_PASSWORD}

# Logging - less verbose in production
logging.level.root=WARN
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN

# Server settings
server.tomcat.max-threads=400
server.tomcat.min-spare-threads=40
server.tomcat.max-connections=20000
server.tomcat.accept-count=200

# SSL configuration
server.ssl.enabled=true
server.ssl.key-store=${KEY_STORE_PATH}
server.ssl.key-store-password=${KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat